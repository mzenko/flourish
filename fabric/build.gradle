plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No 'mappings' line: Minecraft 26.1+ ships unobfuscated with Mojang names + param names.

    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // ash_api supplies the config + in-game options screen (and its Mod Menu integration).
    if (project.ash_version != "") {
        implementation "com.diontryban.ash_api:ash_api-fabric:${project.ash_version}"
    }

    if (project.modmenu_version != "") {
        implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    }


}

loom {
    def aw = project(':common').file("src/main/resources/${project.mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }

        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
